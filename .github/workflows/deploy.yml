# main 브랜치에 push → 빌드 → 문법 검사 → 테스트 → Cloudflare Workers 배포 (homerun-king)
# 이것 말고 다른 배포 방법은 쓰지 않는다 (맥 터미널 wrangler deploy 금지 — HANDOFF.md 0절)
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: build
        run: node tools/build.mjs
      - name: syntax check
        run: node --check public/app.js && node --check src/index.js && node --check shared/sim.js
      - name: tests
        run: node --test tests/*.test.mjs
      - name: deploy worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: smoke test (live site answers)
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sf https://homerun-king.jaemin-poker.workers.dev/ -o /dev/null && curl -sf https://homerun-king.jaemin-poker.workers.dev/app.js -o /dev/null; then echo ok; exit 0; fi
            sleep 10
          done
          echo "::error::배포 후 사이트가 응답하지 않음"; exit 1
